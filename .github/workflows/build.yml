name: Build Txtmanager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: ver
        run: |
          VERSION=$(grep -o '"CFBundleVersion": "[0-9.]*"' setup.py | grep -o '[0-9.]*')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install py2app

      - name: Build app
        run: python3 setup.py py2app

      # DISABLED: Signing og notarization er deaktivert til GitHub Secrets er satt opp.
      # Se .github/copilot-instructions.md for hvilke secrets som trengs og hvordan aktivere.
      # - name: Import signing certificate
      # - name: Sign app
      # - name: Create ZIP for notarization
      # - name: Notarize app
      # - name: Staple notarization

      - name: Create distribution ZIP
        run: |
          cd dist
          ditto -c -k --keepParent "Txtmanager.app" "Txtmanager.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Txtmanager-mac
          path: dist/Txtmanager.zip

  release:
    needs: build-mac
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ needs.build-mac.outputs.version }}"
          PREV_TAG=$(git tag --sort=-version:refname | head -1)

          BODY=$(awk "
            /^## \[${VERSION}\]/{found=1; next}
            found && /^## \[/{exit}
            found{print}
          " CHANGELOG.md | sed \
            -e 's/^### Fixed$/## Fixed/' \
            -e 's/^### Added$/## Added/' \
            -e 's/^### Changed$/## Changed/' \
            -e 's/^### Removed$/## Removed/' \
            -e 's/^### Improved$/## Improved/'

          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error title=Missing changelog entry::CHANGELOG.md must contain a ## [${VERSION}] section before release."
            exit 1
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...v${VERSION}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-mac.outputs.version }}
          files: artifacts/Txtmanager-mac/Txtmanager.zip
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          overwrite_files: false
