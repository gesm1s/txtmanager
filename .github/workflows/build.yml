name: Build Txtmanager

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'teksterstatning_gui.py'
      - 'setup.py'
      - 'entitlements.plist'
      - 'requirements.txt'
      - '*.icns'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install py2app

      - name: Build app
        run: python3 setup.py py2app

      # DISABLED: Signing og notarization er deaktivert til GitHub Secrets er satt opp.
      # Se .github/copilot-instructions.md for hvilke secrets som trengs og hvordan aktivere.
      # - name: Import signing certificate
      # - name: Sign app
      # - name: Create ZIP for notarization
      # - name: Notarize app
      # - name: Staple notarization

      - name: Create distribution ZIP
        run: |
          cd dist
          ditto -c -k --keepParent "Txtmanager.app" "Txtmanager.zip"
          rm Txtmanager-notarize.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Txtmanager-mac
          path: dist/Txtmanager.zip

  release:
    needs: build-mac
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Txtmanager-mac/Txtmanager.zip
          generate_release_notes: true
